version: '3.7'

name: purr-ui

services:
  front:
    container_name: purr-ui-prod
    image: purr-ui-prod
    build:
      context: ../.
      dockerfile: ./docker/Dockerfile
      args:
        - WORKDIR='/app'
    ports:
      - 8080:80
    env_file:
      - ../.env
      - ../.env.production
    restart: always
